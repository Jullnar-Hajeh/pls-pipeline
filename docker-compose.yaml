name: pls-pipeline

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build: .
    image: pls-pipeline-airflow:2.10.5
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW_CONN_PLS_SPARK: '{"conn_type":"spark","host":"local[2]"}'
      PLS_JOBS_DIR: /opt/airflow/jobs
      PLS_DATA_DIR: /opt/airflow/source-data
      PLS_STORAGE_DIR: /opt/airflow/pls-storage
    ports:
      - "127.0.0.1:${PLS_AIRFLOW_PORT:-8082}:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./jobs:/opt/airflow/jobs:ro
      - ./data:/opt/airflow/source-data:ro
      - ./config:/opt/airflow/config:ro
      - delta-data:/opt/airflow/pls-storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  delta-data:
